name: tests

on:
  push:

jobs:
  tests:

    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20+8'
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Run tests
        uses: burrunan/gradle-cache-action@v3.0.3
        with:
          arguments: test --no-daemon